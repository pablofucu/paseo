name: Rutas

# Recalcula la ruta a pie entre paradas y la guarda en el repositorio.
# Lánzalo a mano después de cambiar las coordenadas de un tour.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-routes.mjs
      - name: Guardar si ha cambiado
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Rutas a pie recalculadas"
          git push
