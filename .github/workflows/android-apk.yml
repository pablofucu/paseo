name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Comprobaciones
        run: |
          npm run typecheck
          npm run lint
          npm test

      # versionCode creciente: app.config.js lo lee de VERSION_CODE
      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install
        env:
          VERSION_CODE: ${{ github.run_number }}

      # La build de release se firma con la clave de depuración: sirve para instalarla a mano, no para Google Play
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # Un solo .apk con nombre propio: así se sube tal cual, sin zip (archive: false usa el nombre del fichero)
      - name: Preparar el APK
        run: cp android/app/build/outputs/apk/release/app-release.apk paseo-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v7
        with:
          path: paseo-${{ github.run_number }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
