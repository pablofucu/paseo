name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Comprobaciones
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install

      # La build de release se firma con la clave de depuración: sirve para instalarla a mano, no para Google Play
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: paseo-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
